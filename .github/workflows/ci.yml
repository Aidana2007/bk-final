name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      - run: forge coverage
      - run: forge snapshot --check --match-contract AMMGasTest

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: crytic/slither-action@v0.4.1
        with:
          target: .
          slither-args: --filter-paths "node_modules|test|script"
