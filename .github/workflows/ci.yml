name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      - run: forge coverage --exclude-tests --no-match-coverage "script/|test/"
      - run: forge snapshot --match-contract AMMGasTest
      - name: Fork tests
        if: ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL != '' }}
        run: forge test --match-test testFork -vvv
        env:
          RUN_FORK_TESTS: true
          OPTIMISM_SEPOLIA_RPC_URL: ${{ secrets.OPTIMISM_SEPOLIA_RPC_URL }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: crytic/slither-action@v0.4.1
        continue-on-error: true
        with:
          target: .
          slither-args: --filter-paths "node_modules|test|script"
  frontend:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: frontend/package-lock.json
        - run: npm ci
          working-directory: frontend
        - run: npm run lint
          working-directory: frontend
        - run: npm run build
          working-directory: frontend
