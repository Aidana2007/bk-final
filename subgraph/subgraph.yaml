specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GameItems
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GameItems
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ItemBalance
        - ItemTransfer
      abis:
        - name: GameItems
          file: ../frontend/src/abi/GameItems.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
      file: ./src/game-items.ts
  - kind: ethereum
    name: CraftingSystem
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: CraftingSystem
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Recipe
        - Craft
      abis:
        - name: CraftingSystem
          file: ../frontend/src/abi/CraftingSystem.json
      eventHandlers:
        - event: RecipeCreated(indexed uint256,indexed uint256,uint256)
          handler: handleRecipeCreated
        - event: RecipeStatusChanged(indexed uint256,bool)
          handler: handleRecipeStatusChanged
        - event: Crafted(indexed address,indexed uint256,indexed uint256,uint256)
          handler: handleCrafted
      file: ./src/crafting.ts
  - kind: ethereum
    name: VRFLootDrop
    network: optimism-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: VRFLootDrop
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LootRequest
      abis:
        - name: VRFLootDrop
          file: ../frontend/src/abi/VRFLootDrop.json
      eventHandlers:
        - event: LootRequested(indexed uint256,indexed address)
          handler: handleLootRequested
        - event: LootDelivered(indexed uint256,indexed address,indexed uint256,uint256)
          handler: handleLootDelivered
      file: ./src/loot.ts