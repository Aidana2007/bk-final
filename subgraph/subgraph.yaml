specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GameItems
    network: optimism-sepolia
    source:
      address: "0xeeb2b8604574dbdb05653ff5db3be0cb4c9ee64b"
      abi: GameItems
      startBlock: 43634036
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ItemBalance
        - ItemTransfer
      abis:
        - name: GameItems
          file: ./abis/GameItems.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
      file: ./src/game-items.ts
  - kind: ethereum
    name: CraftingSystem
    network: optimism-sepolia
    source:
      address: "0x40ad0efac3eb2bf2c0caec821ab500584b10875b"
      abi: CraftingSystem
      startBlock: 43634036
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Recipe
        - Craft
      abis:
        - name: CraftingSystem
          file: ./abis/CraftingSystem.json
      eventHandlers:
        - event: RecipeCreated(indexed uint256,indexed uint256,uint256)
          handler: handleRecipeCreated
        - event: RecipeStatusChanged(indexed uint256,bool)
          handler: handleRecipeStatusChanged
        - event: Crafted(indexed address,indexed uint256,indexed uint256,uint256)
          handler: handleCrafted
      file: ./src/crafting.ts
  - kind: ethereum
    name: VRFLootDrop
    network: optimism-sepolia
    source:
      address: "0xffb3abb1be3d9edb37c2dbbf6ac8bf0aa86637b4"
      abi: VRFLootDrop
      startBlock: 43651170
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LootRequest
      abis:
        - name: VRFLootDrop
          file: ./abis/VRFLootDrop.json
      eventHandlers:
        - event: LootRequested(indexed uint256,indexed address)
          handler: handleLootRequested
        - event: LootDelivered(indexed uint256,indexed address,indexed uint256,uint256)
          handler: handleLootDelivered
      file: ./src/loot.ts
